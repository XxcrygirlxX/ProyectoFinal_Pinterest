<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Iniciar Sesión</title>
    <link rel="stylesheet" href="login_style.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="login-container">
        <div class="brand-header" onclick="location.href='../index.html'" style="cursor: pointer;">
            <i class="fa-solid fa-heart login-logo-icon"></i>
            <h2>Fyntasy</h2>
        </div>
        <h3>Te damos la bienvenida</h3>
        <p class="subtitle">Encuentra nuevas ideas</p>
        
        <form id="login-form">
            <div class="input-group">
                <label for="log-email">Correo Electrónico</label>
                <input type="email" id="log-email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label for="log-password">Contraseña</label>
                <input type="password" id="log-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div style="margin: 1.5rem 0; color: var(--text-muted); font-size: 0.85rem;">o también puedes</div>

        <div style="display: flex; justify-content: center; margin-bottom: 1rem;">
            <div id="g_id_onload"
                 data-client_id="TU_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleGoogleCredentialResponse"
                 data-ux_mode="popup">
            </div>
            <div class="g_id_signin" data-type="standard"></div>
        </div>
        
        <div class="login-footer">
            <p>¿Aún no eres parte? <a href="../register/register.html">Regístrate en Fyntasy</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
