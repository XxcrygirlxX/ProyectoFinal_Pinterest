<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest - Login</title>
    <link rel="stylesheet" href="login_style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <i class="fa-brands fa-pinterest logo-icon"></i>
            </div>
            
            <h2>Bienvenido de nuevo a Pinterest</h2>

            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                    <span class="error-message" id="emailError"></span>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="Crea una contraseña" required>
                    <span class="error-message" id="passwordError"></span>
                </div>

                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>

                <button type="submit" class="btn-submit">Iniciar sesión</button>
            </form>

            <footer class="login-footer">
                <p>¿Aún no estás en Pinterest? <a href="../register/register.html" id="toRegister">Regístrate</a></p>
            </footer>
        </div>
    </main>
</body>
</html>
