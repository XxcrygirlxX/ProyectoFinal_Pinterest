<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de autenticación y control de acceso seguro para usuarios registrados en la plataforma Fyntasy.">
    <title>Fyntasy - Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login_style.css">
    
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <main class="login-container" role="main">
        <header class="brand-header" onclick="location.href='../index.html'" style="cursor: pointer;" role="banner">
            <i class="fa-solid fa-heart login-logo-icon" aria-hidden="true"></i>
            <h2>Fyntasy</h2>
        </header>
        
        <h3>Control de Acceso</h3>
        <p class="subtitle">Ingrese sus credenciales para acceder a sus pins</p>
        
        <form id="login-form" aria-label="Formulario de inicio de sesión tradicional">
            <div class="input-group">
                <label for="log-email">Correo Electrónico</label>
                <input type="email" id="log-email" required placeholder="ejemplo@correo.com" aria-required="true">
            </div>
            <div class="input-group">
                <label for="log-password">Contraseña</label>
                <input type="password" id="log-password" required placeholder="••••••••" aria-required="true">
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
        </form>

        <div style="margin: 1.2rem 0; color: var(--text-muted); font-size: 0.85rem; text-align: center;">o</div>

        <div style="display: flex; justify-content: center; margin-bottom: 1rem; width: 100%;">
            <div id="g_id_onload"
                 data-client_id="62688628748-80so2m75d6mtoeortm12mt1pf4stdup6.apps.googleusercontent.com"
                 data-callback="handleGoogleCredentialResponse"
                 data-ux_mode="popup">
            </div>
            <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline" data-text="signin_with" data-size="large" data-logo_alignment="left" style="width: 100%;"></div>
        </div>
        
        <footer class="login-footer">
            <p>¿No dispone de una cuenta? <a href="../register/register.html">Registrarse</a></p>
        </footer>
    </main>
    <script src="login.js" defer></script>
</body>
</html>
