<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest - Mi Perfil</title>
    <link rel="stylesheet" href="profile_style.css">
</head>
<body>

    <header class="pinterest-navbar">
        <div class="nav-left">
            <a href="../index.html" class="nav-logo">
                <i class="fa-brands fa-pinterest"></i>
            </a>
            <a href="../index.html" class="nav-btn">Inicio</a>
        </div>
        <div class="nav-right">
            <a href="../login/login.html" class="nav-auth-btn btn-login">Iniciar sesión</a>
            <a href="../register/register.html" class="nav-auth-btn btn-register">Registrarse</a>
            <a href="profile.html" class="nav-profile-icon active" title="Mi Perfil">
                <i class="fa-solid fa-user"></i>
            </a>
        </div>
    </header>

    <main class="profile-container">
        
        <section class="profile-header">
            <div class="profile-avatar-container">
                <div class="profile-avatar" id="userAvatar">E</div>
            </div>
            
            <h1 class="profile-name" id="profileName">Elianna</h1>
            <p class="profile-username" id="profileUsername">@elianna</p>
            <p class="profile-bio" id="profileBio">Pruebita</p>
            
            <div class="profile-actions">
                <button class="btn-edit" id="btnOpenEdit">Editar perfil</button>
                <button class="btn-share-profile"><i class="fa-solid fa-share-nodes"></i></button>
            </div>
        </section>

        <hr class="profile-divider">

        <div class="profile-tabs">
            <button class="tab-btn active">Creados</button>
            <button class="tab-btn">Guardados</button>
        </div>

        <section class="user-publications">
            <div class="publications-grid" id="userGrid">
                </div>
        </section>
    </main>

    <div id="editModal" class="modal-overlay">
        <div class="edit-card">
            <h2>Editar tu perfil</h2>
            <p class="edit-subtitle">Mantén tu información personal actualizada públicamente.</p>
            
            <form id="editProfileForm">
                <div class="form-group">
                    <label for="inputName">Nombre público</label>
                    <input type="text" id="inputName" required>
                </div>
                
                <div class="form-group">
                    <label for="inputBio">Acerca de ti (Biografía)</label>
                    <textarea id="inputBio" rows="3" placeholder="Cuéntale a la comunidad sobre ti..."></textarea>
                </div>

                <div class="modal-form-actions">
                    <button type="button" class="btn-cancel" id="btnCancelEdit">Cancelar</button>
                    <button type="submit" class="btn-submit-save">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
