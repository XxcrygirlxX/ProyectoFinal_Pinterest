<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Mi Perfil</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="profile_style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <header class="navbar">
        <div class="logo" onclick="location.href='../index.html'" style="cursor: pointer;">
            <i class="fa-solid fa-heart"></i>
            <span>Fyntasy</span>
        </div>
        <button class="btn-back" onclick="location.href='../index.html'"><i class="fa-solid fa-house"></i> Volver</button>
    </header>

    <main class="profile-container">
        <section class="user-profile-header">
            <div class="avatar-container">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
            </div>
            <h2 id="profile-username">@Username</h2>
            <p class="profile-bio" id="profile-bio">Diseñando mi tablero de sueños en Fyntasy</p>
            
            <div class="profile-stats">
                <span id="pin-count">0</span> Pines publicados
            </div>
            
            <button class="btn-edit-profile" onclick="alert('La edición de perfil estará disponible en Fyntasy V2.0')">Editar Perfil</button>
        </section>

        <div class="profile-tabs">
            <button class="tab-btn active">Mis Pines</button>
            <button class="tab-btn" onclick="alert('Próximamente podrás ver tus tableros guardados.')">Guardados <i class="fa-solid fa-lock" style="font-size:0.7rem;"></i></button>
        </div>

        <section class="user-gallery">
            <div class="pin-grid" id="user-pin-grid"></div>
        </section>
    </main>

    <script src="profile.js"></script>
</body>
</html>
