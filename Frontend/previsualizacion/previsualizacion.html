<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Módulo de auditoría e inspección detallada de recursos indexados en el bucket de almacenamiento Fyntasy.">
    <title>Fyntasy - Vista Avanzada de Pin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="previsualizacion_style.css">
</head>
<body>

    <header class="preview-navbar">
        <span class="back-logo" onclick="location.href='../index.html'" role="button" style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;" aria-label="Regresar al panel de inicio">
            <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            <i class="fa-solid fa-heart" aria-hidden="true"></i>
            <span>Fyntasy</span>
        </span>
    </header>

    <main class="preview-container">
        <article class="pin-detailed-card">
            
            <figure class="pin-image-zone" style="margin: 0; padding: 0;">
                <img id="pin-image" src="" alt="Recurso en proceso de renderizado desde la infraestructura de AWS..." decoding="async">
            </figure>
            
            <section class="pin-details-zone">
                <span class="category-tag" id="pin-category-tag"><i class="fa-solid fa-sparkles" aria-hidden="true"></i> Clasificación</span>
                <h1 id="pin-title">Cargando título...</h1>
                
                <section class="pin-meta-author" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 1rem 0;">
                    <p class="author-badge" style="margin: 0; font-size: 0.95rem;">
                        Autor del pin: <span id="pin-author" style="font-weight: 700; color: var(--pink-dark);">@autor</span>
                    </p>
                    <button id="btn-reportar-detalle" style="background: none; border: none; color: #ff4d6d; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem;" aria-label="Enviar reporte de infracción comunitaria">
                        <i class="fa-solid fa-flag" aria-hidden="true"></i> Reportar Pin
                    </button>
                </section>
                
                <p id="pin-description">Leyendo descripción...</p>
                
                <section class="comments-container">
                    <h4>Comentarios</h4>
                    <section class="comments-list" id="comments-list"></section>
                    <section class="comment-box" id="comment-box-wrapper"></section>
                </section>
            </section>

        </article>
    </main>

    <script src="previsualizacion.js" defer></script>
</body>
</html>
