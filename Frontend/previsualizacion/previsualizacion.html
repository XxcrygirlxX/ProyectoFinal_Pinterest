<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Detalle de Idea</title>
    <link rel="stylesheet" href="previsualizacion_style.css">
</head>
<body>

    <header class="preview-navbar">
        <span class="back-logo" onclick="location.href='../index.html'" role="button" style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fa-solid fa-chevron-left"></i>
            <i class="fa-solid fa-heart"></i>
            <span>Fyntasy</span>
        </span>
    </header>

    <main class="preview-container">
        <article class="pin-detailed-card">
            
            <figure class="pin-image-zone" style="margin: 0; padding: 0;">
                <img id="pin-image" src="" alt="Cargando recurso de AWS S3 Cloud...">
            </figure>
            
            <section class="pin-details-zone">
                <span class="category-tag" id="pin-category-tag"><i class="fa-solid fa-sparkles"></i> Inspiración</span>
                
                <h1 id="pin-title">Cargando título...</h1>
                
                <section class="pin-meta-author" style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 1rem 0;">
                    <p class="author-badge" style="margin: 0; font-size: 0.95rem;">
                        Subido por: <span id="pin-author" style="font-weight: 700; color: var(--pink-dark);">@autor</span>
                    </p>
                    
                    <div class="action-buttons-group" style="display: flex; gap: 0.8rem;">
                        <button id="btn-copiar-enlace" style="background: #fff0f3; border: 1px solid var(--border-soft); color: var(--pink-dark); padding: 0.4rem 0.8rem; border-radius: 12px; cursor: pointer; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem;" title="Copiar URL de AWS S3">
                            <i class="fa-solid fa-link"></i> Compartir
                        </button>
                        
                        <button id="btn-reportar-detalle" style="background: none; border: none; color: #ff4d6d; cursor: pointer; font-size: 0.88rem; font-weight: 600; display: flex; align-items: center; gap: 0.3rem;" title="Reportar contenido inapropiado">
                            <i class="fa-solid fa-flag"></i> Reportar
                        </button>
                    </div>
                </section>
                
                <p id="pin-description">Cargando la descripción del pin...</p>
                
                <section class="comments-container">
                    <h4>Comentarios de la Comunidad</h4>
                    <section class="comments-list" id="comments-list"></section>
                    <section class="comment-box" id="comment-box-wrapper"></section>
                </section>
            </section>

        </article>
    </main>

    <script src="previsualizacion.js"></script>
</body>
</html>
