<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Detalle de Idea</title>
    <link rel="stylesheet" href="previsualizacion_style.css">
</head>
<body>

    <header class="preview-navbar">
        <div class="back-logo" onclick="location.href='../index.html'">
            <i class="fa-solid fa-chevron-left"></i>
            <i class="fa-solid fa-heart"></i>
            <span>Fyntasy</span>
        </div>
    </header>

    <main class="preview-container">
        <div class="pin-detailed-card">
            <div class="pin-image-zone">
                <img id="pin-image" src="" alt="Cargando recurso...">
            </div>
            
            <div class="pin-details-zone">
                <div class="details-inner">
                    <span class="category-tag" id="pin-category-tag"><i class="fa-solid fa-sparkles"></i> Inspiración</span>
                    <h1 id="pin-title">Cargando título...</h1>
                    <p class="author-badge">Subido por: <span id="pin-author" style="font-weight: 700; color: var(--pink-dark);">@autor</span></p>
                    <p id="pin-description">Cargando la descripción del pin...</p>
                    
                    <div class="comments-container">
                        <h4>Comentarios de la Comunidad</h4>
                        <div class="comments-list" id="comments-list"></div>
                        <div class="comment-box" id="comment-box-wrapper"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="previsualizacion.js"></script>
</body>
</html>
