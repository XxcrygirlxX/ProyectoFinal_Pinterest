<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pinterest - Regístrate</title>
    <link rel="stylesheet" href="register_style.css">
</head>
<body>

    <main class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <i class="fa-brands fa-pinterest logo-icon"></i>
            </div>
            
            <h2>Te damos la bienvenida a Pinterest</h2>

            <form id="registerForm" class="login-form">
                <div class="input-group">
                    <label for="regEmail">Correo electrónico</label>
                    <input type="email" id="regEmail" placeholder="Correo electrónico" required>
                    <span class="error-message" id="regEmailError"></span>
                </div>

                <div class="input-group">
                    <label for="regPassword">Contraseña</label>
                    <input type="password" id="regPassword" placeholder="Crea una contraseña" required>
                    <span class="error-message" id="regPasswordError"></span>
                </div>

                <div class="input-group">
                    <label for="regBirthdate">Fecha de nacimiento</label>
                    <input type="date" id="regBirthdate" required>
                    <span class="error-message" id="regBirthdateError"></span>
                </div>

                <p class="terms-text">
                    Al continuar, aceptas las **Condiciones del servicio** de Pinterest y reconoces que leíste la **Política de privacidad**.
                </p>

                <button type="submit" class="btn-submit">Continuar</button>
            </form>

            <footer class="login-footer">
                <p>¿Ya eres miembro? <a href="../login/login.html" id="toLogin">Inicia sesión</a></p>
            </footer>
        </div>
    </main>
</body>
</html>
