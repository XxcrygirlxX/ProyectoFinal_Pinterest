<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Crear Cuenta</title>
    <link rel="stylesheet" href="register_style.css">
</head>
<body>
    <div class="register-container">
        <div class="brand-header" onclick="location.href='../index.html'" style="cursor: pointer;">
            <i class="fa-solid fa-heart register-logo-icon"></i>
            <h2>Fyntasy</h2>
        </div>
        <h3>Únete a nuestra comunidad</h3>
        <p class="subtitle">Crea tu cuenta y empieza a coleccionar</p>
        
        <form id="register-form">
            <div class="input-group">
                <label for="reg-username">Nombre de Usuario</label>
                <input type="text" id="reg-username" required placeholder="Ej. elianna_s">
            </div>
            <div class="input-group">
                <label for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="ejemplo@correo.com">
            </div>
            <div class="input-group">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required placeholder="Mínimo 6 caracteres">
            </div>
            <button type="submit" class="btn-register">Registrarse</button>
        </form>
        
        <div class="register-footer">
            <p>¿Ya tienes una cuenta? <a href="../login/login.html">Inicia sesión</a></p>
        </div>
    </div>
    <script src="register.js"></script>
</body>
</html>
