<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyntasy - Inspiración</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo" id="btn-logo">
            <i class="fa-solid fa-heart icon-logo"></i>
            <span>Fyntasy</span>
        </div>
        
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="search-input" placeholder="Buscar entretenimiento...">
        </div>
        
        <nav class="nav-menu">
            <button class="btn-nav active" id="btn-inicio">Inicio</button>
            <div id="auth-actions" class="auth-flex"></div>
        </nav>
    </header>

    <div class="categories-bar">
        <button class="category-chip active" data-category="todas">Mostrar Todo</button>
        <button class="category-chip" data-category="paisajes">Paisajes</button>
        <button class="category-chip" data-category="entretenimiento">Entretenimiento</button>
        <button class="category-chip" data-category="chill">Chill</button>
    </div>

    <main class="feed-container">
        <div class="pin-grid" id="pin-grid">
            </div>
    </main>

    <div class="modal" id="upload-modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal-btn">&times;</span>
            <h3>Compartir en Fyntasy</h3>
            <form id="upload-form">
                <div class="form-group">
                    <label for="pin-title">Título de tu Pin</label>
                    <input type="text" id="pin-title" required placeholder="Ej. Mi rincón favorito de lectura">
                </div>
                
                <div class="form-group">
                    <label for="pin-description">Añade una descripción</label>
                    <textarea id="pin-description" required placeholder="Cuéntale a la comunidad de qué trata tu idea..."></textarea>
                </div>

                <div class="form-group">
                    <label for="pin-category">Categoría del Pin</label>
                    <select id="pin-category" required style="background-color: var(--pink-light); border: 1px solid transparent; padding: 0.8rem 1rem; border-radius: 14px; color: var(--text-dark); font-size: 0.92rem; outline: none;">
                        <option value="paisajes">Paisajes</option>
                        <option value="entretenimiento">Entretenimiento</option>
                        <option value="chill" selected>Chill</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="pin-file">Subir Imagen</label>
                    <input type="file" id="pin-file" accept="image/*" required>
                </div>
                
                <div class="ethical-card">
                    <p><i class="fa-solid fa-hand-holding-heart"></i> <strong>Moderación Activa por IA:</strong> Al subir tu foto, nuestro modelo neuronal h5 y el filtro de palabras analizarán el contenido para garantizar un espacio ético libre de cosas obscenas.</p>
                </div>
                
                <button type="submit" class="btn-submit">Publicar Idea</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
